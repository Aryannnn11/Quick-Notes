<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quick Notes</title>

  <link rel="stylesheet" href="style.css" />
</head>

<body>

  <header class="header">
    <div>
      <h1>Quick Notes</h1>
      <p>Keep your thoughts organized.</p>
    </div>

    <button id="themeToggleBtn" class="theme-btn">🌙</button>
  </header>


  <main class="container">

    <div class="toolbar">

      <input
        type="text"
        id="searchInput"
        placeholder="Search your notes..."
        class="search-input"
      />

      <button
        class="add-note-btn"
        onclick="openNoteDialog()"
      >
        + Add Note
      </button>

    </div>


    <div id="notesContainer" class="notes-container"></div>

  </main>


  <!-- Add / Edit Note Dialog -->

  <dialog id="noteDialog" class="note-dialog">

    <form id="noteForm">

      <div class="dialog-header">

        <h2 id="dialogTitle">
          Add New Note
        </h2>

        <button
          type="button"
          class="close-btn"
          onclick="closeNoteDialog()"
        >
          ×
        </button>

      </div>


      <div class="form-group">

        <label for="noteTitle">
          Title
        </label>

        <input
          type="text"
          id="noteTitle"
          maxlength="60"
          placeholder="Enter note title"
          required
        />

      </div>


      <div class="form-group">

        <label for="noteContent">
          Note
        </label>

        <textarea
          id="noteContent"
          maxlength="500"
          placeholder="Write your note..."
          required
        ></textarea>

        <div class="character-counter">
          <span id="characterCount">0</span>/500
        </div>

      </div>


      <div class="dialog-actions">

        <button
          type="button"
          class="cancel-btn"
          onclick="closeNoteDialog()"
        >
          Cancel
        </button>

        <button
          type="submit"
          class="save-btn"
        >
          Save Note
        </button>

      </div>

    </form>

  </dialog>


  <script src="app.js"></script>

</body>
</html>
